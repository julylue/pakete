<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pakete">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f6f5f2">
<title>Pakete</title>
<style>
  :root{
    --bg:#f6f5f2; --card:#fff; --ink:#1c1c1c; --muted:#8a8780; --line:#e7e4de;
    --ok:#1f8a4c; --warn:#d9822b; --late:#c62828;
    --gls:#1d3c9e; --dhl:#ffcc00; --hermes:#0a8fd1; --dpd:#d0103a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:90px}
  header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 14px 10px}
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#ebe8e2;border-radius:14px;padding:5px}
  .tab{border:0;background:transparent;border-radius:10px;padding:10px 4px;font:inherit;font-size:15px;font-weight:600;color:#6b6860;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
  .tab b{font-size:24px;line-height:1;color:inherit}
  .tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  main{padding:4px 14px}
  .sortbar{display:flex;gap:6px;padding:2px 14px 8px;overflow-x:auto}
  .sortbar button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font:inherit;font-size:14px;font-weight:600;color:#6b6860;cursor:pointer;white-space:nowrap}
  .sortbar button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  @media(min-width:700px){.sortbar{max-width:640px;margin:0 auto}}
  .group{margin:18px 2px 8px;font-size:14px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.04em}
  .card{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:10px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:pointer}
  .thumbs{position:relative;width:64px;height:64px;flex:none}
  .thumbs img{width:64px;height:64px;object-fit:cover;border-radius:10px;background:#eee;display:block}
  .thumbs .n{position:absolute;right:-4px;bottom:-4px;background:var(--ink);color:#fff;font-size:13px;font-weight:700;border-radius:10px;padding:1px 7px;border:2px solid #fff}
  .ph{width:64px;height:64px;border-radius:10px;background:#eee;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:26px}
  .info{flex:1;min-width:0}
  .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
  .pill{font-size:13px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
  .pill.GLS{background:var(--gls);color:#fff}.pill.DHL{background:var(--dhl);color:#222}
  .pill.Hermes{background:var(--hermes);color:#fff}.pill.DPD{background:var(--dpd);color:#fff}
  .pill.none{background:#fff3e6;color:var(--warn);border:1.5px dashed var(--warn)}
  .due{font-size:13px;color:var(--muted)}
  .due.soon{color:var(--warn);font-weight:700}.due.late{color:var(--late);font-weight:700}
  .kiste{font-size:13px;color:var(--muted)}
  .check{flex:none;width:52px;height:52px;border-radius:50%;border:2.5px solid #cfcac1;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .check svg{width:26px;height:26px;stroke:#cfcac1}
  .check:active{transform:scale(.94)}
  .done .check{background:var(--ok);border-color:var(--ok)}.done .check svg{stroke:#fff}
  .done{opacity:.6}
  .empty{text-align:center;color:var(--muted);padding:60px 20px}
  .empty svg{width:56px;height:56px;stroke:#c9c4ba;margin-bottom:8px}
  .status{font-size:14px;color:var(--muted);text-align:center;padding:8px}
  /* Detail */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:none}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:#fff;border-radius:22px 22px 0 0;max-height:92vh;overflow:auto;padding:10px 18px 28px;transform:translateY(100%);transition:transform .22s ease}
  .open .scrim{display:block}.open .sheet{transform:none}
  .grab{width:44px;height:5px;border-radius:3px;background:#ddd;margin:2px auto 12px}
  .x{position:absolute;right:12px;top:10px;border:0;background:#f0eee9;width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer}
  .sheet h2{font-size:21px;margin:4px 40px 12px 0}
  .teile{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
  .teil{display:flex;gap:12px;align-items:center}
  .teil img{width:120px;height:120px;object-fit:cover;border-radius:12px;background:#eee}
  .teil .ph{width:96px;height:96px}
  .lbl{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:16px 0 8px}
  .carriers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .car{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px;text-align:left;font:inherit;cursor:pointer}
  .car b{display:block;font-size:16px}.car span{font-size:14px;color:var(--muted)}
  .car.on.GLS{border-color:var(--gls);background:#eef1fb}.car.on.DHL{border-color:#e0b400;background:#fff9dc}
  .car.on.Hermes{border-color:var(--hermes);background:#e9f6fd}.car.on.DPD{border-color:var(--dpd);background:#fdeef1}
  .facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:16px}
  .facts dt{color:var(--muted)}.facts dd{margin:0;font-weight:600}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
  .step{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 4px;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
  .step.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .nr{display:inline-block;margin-bottom:4px;background:var(--ink);color:#fff;font-family:ui-monospace,Menlo,monospace;font-size:13px;font-weight:800;letter-spacing:.04em;border-radius:6px;padding:1px 6px;margin-right:7px;vertical-align:1px}
  .nrbig{display:block;width:fit-content;margin-right:40px;background:var(--ink);color:#fff;font-family:ui-monospace,Menlo,monospace;font-size:24px;font-weight:800;letter-spacing:.05em;border-radius:10px;padding:4px 12px;margin-bottom:6px}
  .big{margin:0 0 14px}
  .big img{width:100%;max-height:62vh;object-fit:contain;background:#f3f1ec;border-radius:14px;display:block;cursor:zoom-in}
  .big figcaption{font-size:15px;color:var(--muted);margin-top:6px}
  .bigph{width:100%;height:200px;font-size:40px}
  .where{font-size:22px;font-weight:700;margin:4px 0 14px}
  .where .pill{font-size:15px;padding:5px 12px}
  .qr{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;cursor:zoom-in}
  .qr img{width:100%;display:block;image-rendering:pixelated}
  .line{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);font-size:17px}
  .line span{color:var(--muted)}
  .note{background:#f6f5f2;border-radius:12px;padding:10px 12px;margin:12px 0;font-size:15px}
  .sel{margin-top:16px;width:100%;font:inherit;font-size:17px;font-weight:600;padding:12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);appearance:auto}
  .zoom{flex-direction:column}
  .ztop{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;padding:14px 16px;color:#fff;font-weight:700}
  .zoom.white .ztop{color:var(--ink)}
  .ztop .nr{font-size:18px;padding:3px 10px;margin:0}
  .zx{margin-left:auto;border:0;background:rgba(255,255,255,.2);color:inherit;width:40px;height:40px;border-radius:50%;font-size:22px;cursor:pointer}
  .zoom.white .zx{background:#eee}
  .zarr{position:absolute;top:50%;transform:translateY(-50%);border:0;background:rgba(255,255,255,.18);color:#fff;width:52px;height:72px;border-radius:12px;font-size:40px;line-height:1;cursor:pointer}
  .zoom.white .zarr{background:#eee;color:var(--ink)}
  .zprev{left:8px}.znext{right:8px}
  .zcap{position:absolute;bottom:18px;left:16px;right:16px;text-align:center;color:#fff;font-size:16px}
  .zoom.white .zcap{color:var(--ink)}
  .zoom img{max-height:78vh}
  /* Versandfarben */
  .nr.c-DHL,.nrbig.c-DHL{background:var(--dhl);color:#222}
  .nr.c-GLS,.nrbig.c-GLS{background:var(--gls);color:#fff}
  .nr.c-DPD,.nrbig.c-DPD{background:var(--dpd);color:#fff}
  .nr.c-Hermes,.nrbig.c-Hermes{background:var(--hermes);color:#fff}
  .card.b-DHL{border-left:6px solid var(--dhl)}
  .card.b-GLS{border-left:6px solid var(--gls)}
  .card.b-DPD{border-left:6px solid var(--dpd)}
  .card.b-Hermes{border-left:6px solid var(--hermes)}
  .group .pill{margin-right:4px}
  .where{display:flex;align-items:center;gap:10px}
  .where .pill{font-size:15px;padding:4px 11px}
  .zoom.white{background:#fff}
  .zoom.white img{image-rendering:pixelated;width:100%;max-width:90vmin}
  .zoom{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
  .zoom.show{display:flex}
  .zoom img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
  .teil img{cursor:zoom-in}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px 12px 18px;display:flex;gap:14px;align-items:center;z-index:30;transition:transform .2s;font-size:16px;max-width:92vw}
  .toast.show{transform:translateX(-50%)}
  .toast button{border:0;background:#fff;color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-weight:700;cursor:pointer}
  @media(min-width:700px){main,header{max-width:640px;margin:0 auto}.sheet{max-width:640px;margin:0 auto}}
</style>
</head>
<body>
<header>
  <div class="tabs" role="tablist">
    <button class="tab on" data-tab="packen"><b id="c-packen">0</b>Packen</button>
    <button class="tab" data-tab="wegbringen"><b id="c-wegbringen">0</b>Wegbringen</button>
    <button class="tab" data-tab="abgegeben"><b id="c-abgegeben">0</b>Abgegeben</button>
  </div>
</header>
<div class="sortbar" id="sortbar" style="display:none">
  <button data-sort="frist">Frist</button><button data-sort="neu">Neueste</button><button data-sort="alt">Älteste</button><button data-sort="versand">Versand</button>
</div>
<main id="list"><div class="status">Lädt …</div></main>

<div id="detail">
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet"></div>
</div>
<div class="zoom" id="zoom">
  <div class="ztop"><span id="zLabel" class="nr"></span><span id="zCount"></span><button class="zx" id="zClose" aria-label="schließen">×</button></div>
  <img id="zoomImg" alt="" referrerpolicy="no-referrer">
  <button class="zarr zprev" id="zPrev" aria-label="zurück">‹</button><button class="zarr znext" id="zNext" aria-label="weiter">›</button>
  <div class="zcap" id="zCap"></div>
</div>
<div class="toast" id="toast"><span id="toastText"></span><button id="undo">Zurück</button></div>

<script>
/* Datenquelle: Google-Tabelle "Pakete Pickliste" (Ordner Vinted & Co.) über das Skript "Pakete Schnittstelle".
   Der Schlüssel kommt nur über den persönlichen Link (?k=...) und bleibt im Gerät. */
const API = "https://script.google.com/macros/s/AKfycbwrtPmeOpBoyw8oTxCBOb4PfgDcT2zAcVw1qxoiXNsbWOpew14GC6Qy9G7oJ12XNE58vQ/exec";
const ORTE = { GLS:"Türkischer Supermarkt", DHL:"Foto Kasse", Hermes:"Mr. Kiosk", DPD:"NKD" };
const STEPS = ["packen","wegbringen","abgegeben"];
const STEP_LABEL = {packen:"Packen", wegbringen:"Wegbringen", abgegeben:"Abgegeben"};
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

let sortBy = "frist";
try { const v = localStorage.getItem("pakete-sort"); if(v) sortBy = v; } catch(e){}
let items = [], tab = "packen", openId = null, key = "", busy = 0;
let undoInfo = null, toastTimer = null;
try { const t = localStorage.getItem("pakete-tab"); if (STEPS.includes(t)) tab = t; } catch(e){}
try { key = new URLSearchParams(location.search).get("k") || ""; if(key) localStorage.setItem("pakete-key", key); else key = localStorage.getItem("pakete-key") || ""; } catch(e){}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const img = id => /^[\w-]{10,}$/.test(String(id||"")) ? "https://drive.google.com/thumbnail?id=" + id + "&sz=w400" : "";
const carOf = it => ORTE[it.versand] ? it.versand : "none";
const bigImg = id => img(id).replace("sz=w400","sz=w1600");
const teileOf = it => { try { const t = JSON.parse(it.teile || "[]"); return Array.isArray(t) ? t : []; } catch(e){ return []; } };

function dueText(iso){
  const d = toDay(iso); if(!d) return null;
  const t = new Date(); t.setHours(0,0,0,0);
  const n = Math.round((d - t) / 86400000);
  if(n < 0) return {t:"überfällig", c:"late"};
  if(n === 0) return {t:"heute", c:"late"};
  if(n === 1) return {t:"bis morgen", c:"soon"};
  return {t:"bis " + ["So","Mo","Di","Mi","Do","Fr","Sa"][d.getDay()] + " " + d.getDate() + "." + (d.getMonth()+1) + ".", c:""};
}
function toDay(v){
  if(!v) return null; const s = String(v);
  const d = /^\d{4}-\d\d-\d\d$/.test(s) ? new Date(s + "T00:00:00") : new Date(s);
  if(isNaN(d)) return null; d.setHours(0,0,0,0); return d;
}
const ts = v => { const d = new Date(String(v||"")); return isNaN(d) ? 0 : d.getTime(); };
const soldTs = it => { const m = String(it.id||"").match(/-(\d\d)(\d\d)$/); return m ? new Date(2026, +m[2]-1, +m[1]).getTime() : 0; };
const CAR_ORDER = ["DHL","GLS","DPD","Hermes"];
const carRank = it => { const i = CAR_ORDER.indexOf(it.versand); return i < 0 ? 9 : i; };
const dayTs = v => { const d = toDay(v); return d ? d.getTime() : 9e15; };
function fmtDate(iso){ const d = new Date(iso); return isNaN(d) ? "" : d.getDate()+"."+(d.getMonth()+1)+"."; }
function thumbs(it){
  const t = teileOf(it), src = img(t[0]?.bild);
  return `<div class="thumbs">${src ? `<img src="${src}" alt="" referrerpolicy="no-referrer">` : `<div class="ph">?</div>`}${t.length > 1 ? `<span class="n">${t.length}</span>` : ""}</div>`;
}
function pill(v){ return ORTE[v] ? `<span class="pill ${v}">${v} · ${ORTE[v]}</span>` : `<span class="pill none">Versand?</span>`; }

function card(it){
  const nr = it.nr ? `<span class="nr c-${carOf(it)}">${esc(it.nr)}</span>` : "";
  let left = "", meta = "";
  if(it.status === "packen") left = thumbs(it);
  if(it.status !== "abgegeben"){
    const due = dueText(it.frist);
    if(due) meta = `<div class="meta"><span class="due ${due.c}">${due.t}</span></div>`;
  }
  return `<div class="card b-${carOf(it)} ${it.status==='abgegeben'?'done':''}" data-id="${esc(it.id)}">
    ${left}
    <div class="info">${nr}<div class="t">${esc(it.titel)}</div>${meta}</div>
    <button class="check" data-check="${esc(it.id)}" aria-label="abhaken">${CHECK}</button>
  </div>`;
}
function render(){
  for(const s of STEPS) $("#c-"+s).textContent = items.filter(i=>i.status===s).length;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on", b.dataset.tab===tab));
  const byDue = (a,b) => (dayTs(a.frist) - dayTs(b.frist)) || String(a.nr).localeCompare(String(b.nr));
  const cmp = tab === "abgegeben" ? (a,b) => ts(b.abgegeben_am) - ts(a.abgegeben_am)
    : tab === "wegbringen" ? byDue
    : sortBy === "neu" ? (a,b) => soldTs(b) - soldTs(a) || byDue(a,b)
    : sortBy === "alt" ? (a,b) => soldTs(a) - soldTs(b) || byDue(a,b)
    : sortBy === "versand" ? (a,b) => carRank(a) - carRank(b) || byDue(a,b)
    : byDue;
  const list = items.filter(i=>i.status===tab).sort(cmp);
  $("#sortbar").style.display = tab === "packen" && list.length > 1 ? "" : "none";
  document.querySelectorAll("#sortbar button").forEach(b=>b.classList.toggle("on", b.dataset.sort===sortBy));
  const box = $("#list");
  if(!list.length) box.innerHTML = `<div class="empty">${CHECK}<div>Nichts offen</div></div>`;
  else if(tab === "wegbringen"){
    const g = {}; for(const it of list){ const k = ORTE[it.versand] ? it.versand : "_"; (g[k] ||= []).push(it); }
    box.innerHTML = ["Hermes","DHL","GLS","DPD","_"].filter(k=>g[k]).map(k =>
      `<div class="group">${k==="_" ? "Versand noch offen" : `<span class="pill ${k}">${k}</span>${esc(ORTE[k])}`}</div>` + g[k].map(card).join("")).join("");
  } else box.innerHTML = list.map(card).join("");
  if(openId) renderDetail();
}

function renderDetail(){
  const it = items.find(i=>i.id===openId); if(!it){ closeDetail(); return; }
  const opts = STEPS.map(s=>`<option value="${s}" ${it.status===s?'selected':''}>${STEP_LABEL[s]}</option>`).join("");
  let body = "";
  if(it.status === "packen"){
    body = teileOf(it).map((t,ix)=>{ const src = img(t.bild);
      return `<figure class="big">${src ? `<img src="${bigImg(t.bild)}" data-gal="photos" data-ix="${ix}" alt="" referrerpolicy="no-referrer">` : `<div class="ph bigph">?</div>`}<figcaption>${esc(t.name)}</figcaption></figure>`; }).join("");
  } else if(it.status === "wegbringen"){
    const qr = img(it.qr) ? img(it.qr).replace("sz=w400","sz=w1200") : "";
    body = `<div class="where">${ORTE[it.versand] ? `<span class="pill ${it.versand}">${it.versand}</span>${esc(ORTE[it.versand])}` : "Abgabestelle offen"}</div>`
      + (qr ? `<div class="qr" data-gal="codes"><img src="${qr}" alt="Versand-Code" referrerpolicy="no-referrer"></div>` : `<div class="note">Code fehlt noch</div>`);
  }
  $("#sheet").innerHTML = `<div class="grab"></div><button class="x" id="close" aria-label="schließen">×</button>
    <div class="nrbig c-${carOf(it)}">${esc(it.nr || it.titel)}</div>${body}<select id="statusSel" class="sel">${opts}</select>`;
}
let gal = [], galIx = 0;
function openGal(kind, ix){
  const it = items.find(i=>i.id===openId); if(!it) return;
  if(kind === "photos"){
    gal = teileOf(it).filter(t=>img(t.bild)).map(t=>({src:bigImg(t.bild), label:it.nr||"", car:carOf(it), cap:t.name, white:false}));
    galIx = Math.min(ix, gal.length-1);
  } else {
    // alle Codes für dieselbe Abgabestelle, die noch wegmüssen
    const same = items.filter(i=>i.status==="wegbringen" && i.versand===it.versand && img(i.qr)).sort((a,b)=>String(a.nr).localeCompare(String(b.nr)));
    gal = same.map(i=>({src:img(i.qr).replace("sz=w400","sz=w1200"), label:i.nr||"", car:carOf(i), cap:i.titel, white:true}));
    galIx = Math.max(0, same.findIndex(i=>i.id===it.id));
  }
  if(!gal.length) return;
  showGal(); $("#zoom").classList.add("show");
}
function showGal(){
  const g = gal[galIx];
  $("#zoomImg").src = g.src;
  $("#zoom").classList.toggle("white", g.white);
  $("#zLabel").textContent = g.label; $("#zLabel").className = "nr c-" + g.car; $("#zLabel").style.display = g.label ? "" : "none";
  $("#zCount").textContent = gal.length > 1 ? (galIx+1) + " / " + gal.length : "";
  $("#zCap").textContent = g.cap || "";
  $("#zPrev").style.display = $("#zNext").style.display = gal.length > 1 ? "" : "none";
}
function galStep(d){ if(gal.length < 2) return; galIx = (galIx + d + gal.length) % gal.length; showGal(); }
function closeGal(){ $("#zoom").classList.remove("show","white"); gal = []; }
(function(){ let x0 = null;
  document.addEventListener("touchstart", e=>{ if($("#zoom").classList.contains("show")) x0 = e.touches[0].clientX; }, {passive:true});
  document.addEventListener("touchend", e=>{ if(x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if(Math.abs(dx) > 40){ galStep(dx < 0 ? 1 : -1); e.preventDefault(); } }, {passive:false});
})();
function openDetail(id){ openId = id; renderDetail(); $("#detail").classList.add("open"); }
function closeDetail(){ openId = null; $("#detail").classList.remove("open"); }

function flash(text, undo){
  $("#toastText").textContent = text; $("#undo").style.display = undo ? "" : "none"; undoInfo = undo || null;
  $("#toast").classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(()=>$("#toast").classList.remove("show"), 4000);
}

async function load(){
  if(!key){ $("#list").innerHTML = '<div class="status">Bitte den persönlichen Link öffnen</div>'; return; }
  if(busy) return;
  try {
    const r = await fetch(API + "?k=" + encodeURIComponent(key), {cache:"no-store"});
    const j = await r.json();
    if(!j.ok){ $("#list").innerHTML = '<div class="status">Link ungültig</div>'; return; }
    if(!busy){ items = j.items; render(); }
  } catch(e){ if(!items.length) $("#list").innerHTML = '<div class="status">Keine Verbindung</div>'; }
}

async function save(id, patch){
  const it = items.find(i=>i.id===id); if(!it) return false;
  const before = {...it}; Object.assign(it, patch); render(); busy++;
  try {
    const r = await fetch(API, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({k:key, id, patch})});
    const j = await r.json(); if(!j.ok) throw 0;
    busy--; if(!busy){ items = j.items; render(); }
    return true;
  } catch(e){
    busy--; Object.assign(it, before); render(); flash("Nicht gespeichert"); return false;
  }
}

async function advance(id){
  const it = items.find(i=>i.id===id); if(!it) return;
  const old = {status: it.status, abgegeben_am: it.abgegeben_am || ""};
  const next = it.status === "packen" ? {status:"wegbringen"}
    : it.status === "wegbringen" ? {status:"abgegeben", abgegeben_am:new Date().toISOString()}
    : {status:"wegbringen", abgegeben_am:""};
  flash(old.status === "packen" ? "Gepackt" : STEP_LABEL[next.status], {id, patch:old});
  await save(id, next);
}

document.addEventListener("click", e=>{
  if(e.target.closest("#zPrev")){ galStep(-1); return; }
  if(e.target.closest("#zNext")){ galStep(1); return; }
  if(e.target.closest("#zoom")){ closeGal(); return; }
  const g = e.target.closest("[data-gal]");
  if(g){ openGal(g.dataset.gal, +(g.dataset.ix||0)); return; }
  const sb = e.target.closest("[data-sort]");
  if(sb){ sortBy = sb.dataset.sort; try{localStorage.setItem("pakete-sort",sortBy)}catch(_){}; render(); return; }
  const tb = e.target.closest(".tab");
  if(tb){ tab = tb.dataset.tab; try{localStorage.setItem("pakete-tab",tab)}catch(_){}; render(); window.scrollTo(0,0); return; }
  const chk = e.target.closest("[data-check]"); if(chk){ e.stopPropagation(); advance(chk.dataset.check); return; }
  const c = e.target.closest(".card"); if(c){ openDetail(c.dataset.id); return; }
  if(e.target.id === "scrim" || e.target.closest("#close")){ closeDetail(); return; }
  if(e.target.id === "undo" && undoInfo){ const u = undoInfo; undoInfo = null; $("#toast").classList.remove("show"); save(u.id, u.patch); }
});
document.addEventListener("change", e=>{
  if(e.target.id === "statusSel" && openId){ const v = e.target.value; save(openId, {status:v, abgegeben_am: v==="abgegeben" ? new Date().toISOString() : ""}); }
});
document.addEventListener("keydown", e=>{ const zo = $("#zoom").classList.contains("show");
  if(e.key==="Escape"){ if(zo) closeGal(); else closeDetail(); }
  if(zo && e.key==="ArrowRight") galStep(1);
  if(zo && e.key==="ArrowLeft") galStep(-1); });
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) load(); });
setInterval(()=>{ if(!document.hidden) load(); }, 20000);
load();
</script>
</body>
</html>
